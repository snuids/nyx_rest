name: CI - Requirements7

on:
  pull_request:
    paths:
      - 'Dockerfile7'
      - 'sources/requirements7.txt'
      - 'sources/**'
      - '.github/workflows/ci-requirements7.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: requirements7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Dockerfile7
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile7
          load: true
          push: false
          tags: nyx_rest:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check Python dependencies
        run: docker run --rm nyx_rest:ci pip check

      - name: Compile Python sources
        run: docker run --rm nyx_rest:ci python -m compileall -q /opt/sources

      # La suite tourne dans l'image qui vient d'être construite : les dépendances sont déjà
      # installées là (pandas, psycopg2, pyodbc, passlib), et le dépôt est monté pour que les
      # tests exercent le code du commit plutôt que la copie figée dans l'image.
      # Les tests de route se skippent d'eux-mêmes si les dépendances manquent ; ici elles sont
      # présentes, donc un skip signale une régression, pas un environnement incomplet.
      - name: Run the test suite
        run: |
          docker run --rm -v "$PWD:/work" -w /work -e TZ=Europe/Paris \
            nyx_rest:ci python -m unittest discover -s tests

      - name: Show key versions
        run: |
          docker run --rm -i nyx_rest:ci python - <<'PY'
          from importlib.metadata import version
          for package in ["flask", "werkzeug", "numpy", "pandas", "requests", "urllib3", "certifi"]:
              print(package, version(package))
          PY
