name: CI - Requirements7

on:
  pull_request:
    paths:
      - 'Dockerfile7'
      - 'sources/requirements7.txt'
      - 'sources/**'
      - '.github/workflows/ci-requirements7.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: requirements7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Dockerfile7
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile7
          load: true
          push: false
          tags: nyx_rest:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check Python dependencies
        run: docker run --rm nyx_rest:ci pip check

      - name: Compile Python sources
        run: docker run --rm nyx_rest:ci python -m compileall -q /opt/sources

      # The suite runs in the image that has just been built: the dependencies are already
      # installed there (pandas, psycopg2, passlib, ldap3, tzlocal…), and the repository is
      # mounted so that the tests exercise the code of the commit rather than the copy frozen
      # in the image.
      #
      # Two ways this job lied before:
      #   * a skipped test still exits 0 — the route tests skip themselves when a dependency
      #     is missing, so a missing import silently disabled a third of the suite;
      #   * nothing measured how much code the tests actually touched.
      # So: fail on any skip, and gate on a coverage floor. 40 is the level reached on
      # 2026-11-02 (43 % measured locally); raise it as tests land, never lower it.
      - name: Run the test suite with coverage
        run: |
          docker run --rm -v "$PWD:/work" -w /work -e TZ=Europe/Paris \
            nyx_rest:ci sh /work/scripts/ci_test.sh

      - name: Show key versions
        run: |
          docker run --rm -i nyx_rest:ci python - <<'PY'
          from importlib.metadata import version
          for package in ["flask", "werkzeug", "numpy", "pandas", "requests", "urllib3", "certifi"]:
              print(package, version(package))
          PY
