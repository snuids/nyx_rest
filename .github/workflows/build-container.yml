name: Build Docker Container

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      # A licence or workflow change does not change the image, and its commit message carries
      # no version: the version step would fail on it.
      - 'LICENSE'
      - 'LICENCE'
      - '.github/**'
      # a change to the workflow itself does not change the image
      - '.github/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
    steps:
      # The tag is the version of the release, taken from the commit message. Squash, rebase and
      # merge commits all carry it (GitHub repeats the pull request title in the body of a merge
      # commit), but a pull request whose title has no version used to skip the build silently:
      # no red run, no image. It now falls back on the pull request title and fails loudly.
      - name: Resolve the version
        id: extract_version
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION=$(printf '%s\n' "$HEAD_MESSAGE" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || true)

          if [ -z "$VERSION" ]; then
            echo "No version in the commit message, reading the pull request title"
            PR_TITLE=$(curl -sS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              | jq -r 'if type == "array" and length > 0 then .[0].title else empty end' 2>/dev/null || true)
            VERSION=$(printf '%s\n' "$PR_TITLE" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || true)
          fi

          VERSION=${VERSION#v}

          if [ -z "$VERSION" ]; then
            echo "::error::No version (vX.Y.Z) in the commit message nor in the pull request title; refusing to publish an untagged image."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: v$VERSION"

  build:
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push multi-platform Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile7
          platforms: linux/amd64,linux/arm64
          push: true
          tags: snuids/nyx_rest:v${{ needs.prepare.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "Image pushed successfully with version v${{ needs.prepare.outputs.version }}"

  # The export helper is the same code as the API with another entry point (see Dockerfilehelper).
  # Building it here, from the image that was just pushed, is what stops its copy of `common.py`
  # and `pg_common.py` from drifting: that drift left the dashboard export broken in the worker
  # after it had been fixed in the API.
  build-helper:
    needs: [prepare, build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push the export helper
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfilehelper
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            API_VERSION=${{ needs.prepare.outputs.version }}
          tags: snuids/nyx_rest_helper:v${{ needs.prepare.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Helper digest
        run: echo "snuids/nyx_rest_helper:v${{ needs.prepare.outputs.version }} pushed"

