[loggers]
keys=root,gunicorn.error

[logger_root]
level=INFO
handlers=example



[logger_gunicorn.error]
level=INFO
handlers=gunicorn.error
propagate=0
qualname=gunicorn.error


[handlers]
keys=example,gunicorn.error

[handler_example]
# 50 Mo par fichier, 5 archives : 300 Mo au pire au lieu d'un fichier qui grossit sans fin.
# La classe personnalisée sérialise la rotation entre les trois workers gunicorn.
class=log_setup.MultiProcessRotatingFileHandler
formatter=example
args=('./logs/gunicorn.log', 'a', 52428800, 5, 'utf-8')


[handler_gunicorn.error]
class=log_setup.MultiProcessRotatingFileHandler
formatter=example
args=('./logs/RestAPIG.log', 'a', 52428800, 5, 'utf-8')

[formatters]
keys=example,access

[formatter_example]
class=logging.Formatter
format=[%(asctime)s] [%(levelname)s] [%(process)d] [%(name)s] [%(lineno)d] %(message)s
datefmt=%d/%b/%Y:%H:%M:%S

[formatter_access]
class=logging.Formatter
format=%(h)s %(l)s %(u)s %(t)s %(r)s %(s)s %(b)s %(f)s %(a)s
datefmt=%d/%b/%Y:%H:%M:%S (%Z)